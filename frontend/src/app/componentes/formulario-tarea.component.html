<div class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 overflow-hidden">
  <!-- Backdrop con desenfoque profundo -->
  <div class="absolute inset-0 bg-indigo-950/40 backdrop-blur-md" (click)="cancelar()"></div>

  <!-- Contenedor del Modal con altura limitada -->
  <div class="relative bg-white rounded-3xl shadow-2xl w-full max-w-lg max-h-[90vh] flex flex-col overflow-hidden animate-in fade-in zoom-in duration-300 border border-white/20">
    
    <!-- Encabezado Fijo -->
    <div [ngClass]="servicioTemas.obtenerClaseCabeceraModal()" class="px-8 py-5 shrink-0 transition-all duration-500">
      <div class="flex justify-between items-center">
        <div>
          <h2 class="text-xl font-black text-white tracking-tight">{{ editando ? 'Editar Tarea' : 'Nueva Tarea' }}</h2>
          <p class="text-blue-100 text-[10px] font-medium opacity-80 uppercase tracking-widest">TaskCampus Management</p>
        </div>
        <button (click)="cancelar()" class="bg-white/10 hover:bg-white/20 p-2 rounded-xl text-white transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
    </div>
    
    <!-- Cuerpo del Formulario con Scroll si es necesario -->
    <div class="overflow-y-auto flex-1 p-8 bg-gray-50/50">
      <form (ngSubmit)="enviar()" #tareaForm="ngForm" class="space-y-5">
        <div>
          <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 ml-1">Título de la Actividad</label>
          <input type="text" [(ngModel)]="tarea.titulo" name="titulo" required
                 class="w-full bg-white border border-gray-200 rounded-2xl shadow-sm p-3 focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 outline-none transition-all font-medium text-gray-800">
        </div>
        
        <div>
          <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 ml-1">Descripción</label>
          <textarea [(ngModel)]="tarea.descripcion" name="descripcion" rows="2"
                    class="w-full bg-white border border-gray-200 rounded-2xl shadow-sm p-3 focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 outline-none transition-all font-medium text-gray-800 resize-none"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 ml-1">Asignatura</label>
            <input type="text" [(ngModel)]="tarea.asignatura" name="asignatura" required
                   class="w-full bg-white border border-gray-200 rounded-2xl shadow-sm p-3 focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 outline-none transition-all font-medium text-gray-800">
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 ml-1">Entrega</label>
            <input type="date" [(ngModel)]="tarea.fecha_entrega" name="fecha_entrega" required
                   class="w-full bg-white border border-gray-200 rounded-2xl shadow-sm p-3 focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 outline-none transition-all font-medium text-gray-800">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 ml-1">Prioridad</label>
            <div class="relative">
              <select [(ngModel)]="tarea.prioridad" name="prioridad" required
                      class="w-full bg-white border border-gray-200 rounded-2xl shadow-sm p-3 focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 outline-none transition-all font-bold text-gray-800 appearance-none">
                <option value="baja">Baja</option>
                <option value="media">Media</option>
                <option value="alta">Alta</option>
              </select>
              <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-400">
                <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
              </div>
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 ml-1">Estado</label>
            <div class="relative">
              <select [(ngModel)]="tarea.estado" name="estado" required
                      class="w-full bg-white border border-gray-200 rounded-2xl shadow-sm p-3 focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 outline-none transition-all font-bold text-gray-800 appearance-none">
                <option value="pendiente">Pendiente</option>
                <option value="en proceso">En proceso</option>
                <option value="finalizada">Finalizada</option>
              </select>
              <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-400">
                <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
              </div>
            </div>
          </div>
        </div>

        <!-- Botón de Envío dentro del scroll para asegurar visibilidad en móviles -->
        <div class="pt-4">
          <button type="submit" [disabled]="!tareaForm.form.valid"
                  [ngClass]="servicioTemas.obtenerClaseBotonAccion()"
                  class="w-full py-4 text-white rounded-2xl font-bold disabled:opacity-50 disabled:cursor-not-allowed shadow-xl transition-all text-sm uppercase tracking-widest active:scale-95">
            {{ editando ? 'Actualizar Tarea' : 'Crear Tarea' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
