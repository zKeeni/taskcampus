<div class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6">
  <!-- Backdrop con desenfoque profundo -->
  <div class="absolute inset-0 bg-indigo-950/40 backdrop-blur-md" (click)="cancelar()"></div>

  <!-- Contenedor del Modal -->
  <div class="relative bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden animate-in fade-in zoom-in duration-300 border border-white/20">
    <!-- Encabezado con degradado coherente -->
    <div class="bg-gradient-to-r from-red-600 to-blue-700 px-8 py-6">
      <div class="flex justify-between items-center">
        <div>
          <h2 class="text-2xl font-black text-white tracking-tight">{{ editando ? 'Editar Tarea' : 'Nueva Tarea' }}</h2>
          <p class="text-blue-100 text-xs font-medium opacity-80 uppercase tracking-widest mt-1">TaskCampus Management</p>
        </div>
        <button (click)="cancelar()" class="bg-white/10 hover:bg-white/20 p-2 rounded-xl text-white transition-colors">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
    </div>
    
    <!-- Cuerpo del Formulario -->
    <form (ngSubmit)="enviar()" #tareaForm="ngForm" class="p-8 space-y-5 bg-gray-50/50">
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-2 ml-1">Título de la Actividad</label>
        <input type="text" [(ngModel)]="tarea.titulo" name="titulo" required
               placeholder="Ej: Proyecto Final de Sistemas"
               class="w-full bg-white border border-gray-200 rounded-2xl shadow-sm p-3.5 focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 outline-none transition-all font-medium text-gray-800">
      </div>
      
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-2 ml-1">Descripción Detallada</label>
        <textarea [(ngModel)]="tarea.descripcion" name="descripcion" rows="3"
                  placeholder="Añade notas o requerimientos..."
                  class="w-full bg-white border border-gray-200 rounded-2xl shadow-sm p-3.5 focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 outline-none transition-all font-medium text-gray-800 resize-none"></textarea>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-2 ml-1">Asignatura</label>
          <input type="text" [(ngModel)]="tarea.asignatura" name="asignatura" required
                 placeholder="Ej: Redes II"
                 class="w-full bg-white border border-gray-200 rounded-2xl shadow-sm p-3.5 focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 outline-none transition-all font-medium text-gray-800">
        </div>

        <div>
          <label class="block text-sm font-bold text-gray-700 mb-2 ml-1">Fecha de Entrega</label>
          <input type="date" [(ngModel)]="tarea.fecha_entrega" name="fecha_entrega" required
                 class="w-full bg-white border border-gray-200 rounded-2xl shadow-sm p-3.5 focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 outline-none transition-all font-medium text-gray-800">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-2 ml-1">Prioridad</label>
          <div class="relative">
            <select [(ngModel)]="tarea.prioridad" name="prioridad" required
                    class="w-full bg-white border border-gray-200 rounded-2xl shadow-sm p-3.5 focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 outline-none transition-all font-bold text-gray-800 appearance-none">
              <option value="baja">🟢 Baja</option>
              <option value="media">🟡 Media</option>
              <option value="alta">🔴 Alta</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-400">
              <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
            </div>
          </div>
        </div>

        <div>
          <label class="block text-sm font-bold text-gray-700 mb-2 ml-1">Estado Actual</label>
          <div class="relative">
            <select [(ngModel)]="tarea.estado" name="estado" required
                    class="w-full bg-white border border-gray-200 rounded-2xl shadow-sm p-3.5 focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 outline-none transition-all font-bold text-gray-800 appearance-none">
              <option value="pendiente">Pendiente</option>
              <option value="en proceso">En proceso</option>
              <option value="finalizada">Finalizada</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-400">
              <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
            </div>
          </div>
        </div>
      </div>

      <!-- Acciones Inferiores -->
      <div class="pt-6 flex flex-col-reverse sm:flex-row justify-end gap-3">
        <button type="button" (click)="cancelar()"
                class="px-6 py-3 border border-gray-200 rounded-2xl text-gray-600 font-bold hover:bg-white hover:border-gray-300 transition-all text-sm uppercase tracking-widest">
          Descartar
        </button>
        <button type="submit" [disabled]="!tareaForm.form.valid"
                class="px-8 py-3 bg-gradient-to-r from-red-500 to-red-600 text-white rounded-2xl font-bold hover:from-red-600 hover:to-red-700 disabled:opacity-50 disabled:cursor-not-allowed shadow-xl shadow-red-500/20 transition-all text-sm uppercase tracking-widest active:scale-95">
          {{ editando ? 'Confirmar Cambios' : 'Registrar Tarea' }}
        </button>
      </div>
    </form>
  </div>
</div>
