<div class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden animate-in fade-in zoom-in duration-200">
    <div class="bg-blue-600 px-6 py-4 flex justify-between items-center">
      <h2 class="text-xl font-bold text-white">{{ editando ? 'Editar Tarea' : 'Nueva Tarea' }}</h2>
      <button (click)="cancelar()" class="text-white/80 hover:text-white">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
    
    <form (ngSubmit)="enviar()" #tareaForm="ngForm" class="p-6 space-y-4">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Título</label>
        <input type="text" [(ngModel)]="tarea.titulo" name="titulo" required
               placeholder="Ej: Estudiar para examen de Redes"
               class="w-full border border-gray-300 rounded-lg shadow-sm p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
      </div>
      
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Descripción</label>
        <textarea [(ngModel)]="tarea.descripcion" name="descripcion" rows="3"
                  placeholder="Detalles adicionales..."
                  class="w-full border border-gray-300 rounded-lg shadow-sm p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"></textarea>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Asignatura</label>
          <input type="text" [(ngModel)]="tarea.asignatura" name="asignatura" required
                 placeholder="Materia"
                 class="w-full border border-gray-300 rounded-lg shadow-sm p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Fecha de Entrega</label>
          <input type="date" [(ngModel)]="tarea.fecha_entrega" name="fecha_entrega" required
                 class="w-full border border-gray-300 rounded-lg shadow-sm p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Prioridad</label>
          <select [(ngModel)]="tarea.prioridad" name="prioridad" required
                  class="w-full border border-gray-300 rounded-lg shadow-sm p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-white">
            <option value="baja">Baja</option>
            <option value="media">Media</option>
            <option value="alta">Alta</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Estado</label>
          <select [(ngModel)]="tarea.estado" name="estado" required
                  class="w-full border border-gray-300 rounded-lg shadow-sm p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-white">
            <option value="pendiente">Pendiente</option>
            <option value="en proceso">En proceso</option>
            <option value="finalizada">Finalizada</option>
          </select>
        </div>
      </div>

      <div class="pt-4 flex justify-end space-x-3">
        <button type="button" (click)="cancelar()"
                class="px-5 py-2.5 border border-gray-300 rounded-lg text-gray-700 font-medium hover:bg-gray-50 transition-colors">
          Cancelar
        </button>
        <button type="submit" [disabled]="!tareaForm.form.valid"
                class="px-5 py-2.5 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed shadow-lg shadow-blue-200 transition-all">
          {{ editando ? 'Actualizar Tarea' : 'Crear Tarea' }}
        </button>
      </div>
    </form>
  </div>
</div>
