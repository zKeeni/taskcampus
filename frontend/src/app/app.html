<div class="min-h-screen bg-gradient-to-br from-red-600 via-blue-700 to-indigo-900 py-12 px-4 sm:px-6 lg:px-8 font-sans">
  <div class="max-w-6xl mx-auto">
    <!-- Header Refinado -->
    <header class="mb-12 flex flex-col md:flex-row justify-between items-center bg-white/10 backdrop-blur-md p-8 rounded-3xl shadow-2xl border border-white/20">
      <div class="text-center md:text-left mb-6 md:mb-0">
        <h1 class="text-5xl font-black text-white tracking-tighter drop-shadow-lg">
          Task<span class="text-red-400">Campus</span>
        </h1>
        <p class="mt-1 text-blue-100 font-medium opacity-90">Gestión de Tareas para Estudiantes de Excelencia</p>
      </div>
      
      <button (click)="abrirNuevoModal()" 
              class="group relative flex items-center px-8 py-4 bg-red-500 text-white rounded-2xl font-bold text-lg hover:bg-red-600 transition-all shadow-xl shadow-red-900/20 active:scale-95">
        <svg class="w-6 h-6 mr-2 group-hover:rotate-90 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"></path>
        </svg>
        Nueva Tarea
      </button>
    </header>

    <main class="space-y-8">
      <!-- Sección de Resumen -->
      <app-resumen-tareas [resumen]="resumen"></app-resumen-tareas>

      <!-- Sección de Tabla -->
      <section class="animate-in slide-in-from-bottom duration-700">
        <app-lista-tareas 
          [tareas]="tareas"
          (alFiltrar)="cargarDatos($event)"
          (alEditar)="editarTarea($event)"
          (alEliminar)="eliminarTarea($event)"
          (alCambiarEstado)="guardarTarea($event)">
        </app-lista-tareas>
      </section>
    </main>

    <!-- Modal para Formulario (Inyectado condicionalmente) -->
    <app-formulario-tarea 
      *ngIf="mostrarModal"
      [tareaInicial]="tareaSeleccionada"
      (alGuardar)="guardarTarea($event)"
      (alCancelar)="cerrarModal()">
    </app-formulario-tarea>

    <footer class="mt-16 text-center text-white/60 text-sm font-medium">
      <div class="flex justify-center space-x-4 mb-4">
        <span class="w-2 h-2 rounded-full bg-red-400"></span>
        <span class="w-2 h-2 rounded-full bg-blue-400"></span>
        <span class="w-2 h-2 rounded-full bg-indigo-400"></span>
      </div>
      <p>&copy; 2026 TaskCampus &bull; Universidad Técnica de Machala</p>
    </footer>
  </div>
</div>
