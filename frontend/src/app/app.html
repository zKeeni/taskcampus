<div class="min-h-screen py-12 px-4 sm:px-6 lg:px-8 font-sans transition-all duration-500 bg-gradient-to-br" 
     [ngClass]="servicioTemas.obtenerClasesFondo()">
  <div class="max-w-6xl mx-auto">
    <!-- Header Refinado -->
    <header class="mb-12 flex flex-col md:flex-row justify-between items-center bg-white/10 backdrop-blur-md p-8 rounded-3xl shadow-2xl border border-white/20">
      <div class="text-center md:text-left mb-6 md:mb-0">
        <h1 class="text-5xl font-black text-white tracking-tighter drop-shadow-lg">
          Task<span class="opacity-80">Campus</span>
        </h1>
        <p class="mt-1 text-blue-100 font-medium opacity-90">Gestión de Tareas para Estudiantes de Excelencia</p>
        
        <!-- Selector de Temas -->
        <div class="mt-4 flex justify-center md:justify-start gap-2">
          <button (click)="cambiarTema('rojo')" class="w-6 h-6 rounded-full bg-red-500 border-2 border-white/50 hover:scale-110 transition-transform" title="Tema Rojo"></button>
          <button (click)="cambiarTema('azul')" class="w-6 h-6 rounded-full bg-blue-500 border-2 border-white/50 hover:scale-110 transition-transform" title="Tema Azul"></button>
          <button (click)="cambiarTema('verde')" class="w-6 h-6 rounded-full bg-emerald-500 border-2 border-white/50 hover:scale-110 transition-transform" title="Tema Verde"></button>
          <button (click)="cambiarTema('morado')" class="w-6 h-6 rounded-full bg-purple-500 border-2 border-white/50 hover:scale-110 transition-transform" title="Tema Morado"></button>
          <button (click)="cambiarTema('amarillo')" class="w-6 h-6 rounded-full bg-amber-500 border-2 border-white/50 hover:scale-110 transition-transform" title="Tema Amarillo"></button>
          <button (click)="cambiarTema('negro')" class="w-6 h-6 rounded-full bg-gray-900 border-2 border-white/50 hover:scale-110 transition-transform" title="Tema Negro"></button>
        </div>
      </div>
      
      <button (click)="abrirNuevoModal()" 
              [ngClass]="servicioTemas.obtenerClaseBotonPrincipal()"
              class="group relative flex items-center px-8 py-4 rounded-2xl font-bold text-lg transition-all shadow-xl active:scale-95">
        <svg class="w-6 h-6 mr-2 group-hover:rotate-90 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"></path>
        </svg>
        Nueva Tarea
      </button>
    </header>

    <main class="space-y-8">
      <!-- Sección de Resumen -->
      <app-resumen-tareas [resumen]="resumen"></app-resumen-tareas>

      <!-- Sección de Tabla -->
      <section class="animate-in slide-in-from-bottom duration-700">
        <app-lista-tareas 
          [tareas]="tareas"
          (alFiltrar)="cargarDatos($event)"
          (alEditar)="editarTarea($event)"
          (alEliminar)="eliminarTarea($event)"
          (alCambiarEstado)="guardarTarea($event)">
        </app-lista-tareas>
      </section>
    </main>

    <!-- Modal para Formulario (Inyectado condicionalmente) -->
    <app-formulario-tarea 
      *ngIf="mostrarModal"
      [tareaInicial]="tareaSeleccionada"
      (alGuardar)="guardarTarea($event)"
      (alCancelar)="cerrarModal()">
    </app-formulario-tarea>

    <footer class="mt-16 text-center text-white/60 text-sm font-medium">
      <div class="flex justify-center space-x-4 mb-4">
        <span class="w-2 h-2 rounded-full bg-red-400"></span>
        <span class="w-2 h-2 rounded-full bg-blue-400"></span>
        <span class="w-2 h-2 rounded-full bg-indigo-400"></span>
      </div>
      <p>&copy; 2026 TaskCampus &bull; Universidad Técnica de Machala</p>
    </footer>
  </div>
</div>
