<div class="min-h-screen bg-gray-100 py-8 px-4 sm:px-6 lg:px-8">
  <div class="max-w-5xl mx-auto">
    <header class="mb-10 text-center">
      <h1 class="text-4xl font-extrabold text-blue-900 tracking-tight">TaskCampus</h1>
      <p class="mt-2 text-lg text-gray-600">Gestión Inteligente de Tareas Académicas</p>
    </header>

    <main>
      <!-- Panel de Resumen -->
      <app-resumen-tareas [resumen]="resumen"></app-resumen-tareas>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- Columna de Formulario -->
        <div class="lg:col-span-1">
          <app-formulario-tarea 
            [tareaInicial]="tareaSeleccionada"
            (alGuardar)="guardarTarea($event)"
            (alCancelar)="cancelarEdicion()">
          </app-formulario-tarea>
        </div>

        <!-- Columna de Lista -->
        <div class="lg:col-span-2">
          <app-lista-tareas 
            [tareas]="tareas"
            (alFiltrar)="cargarDatos($event)"
            (alEditar)="editarTarea($event)"
            (alEliminar)="eliminarTarea($event)">
          </app-lista-tareas>
        </div>
      </div>
    </main>

    <footer class="mt-16 text-center text-gray-500 text-sm border-t pt-8">
      <p>&copy; 2026 TaskCampus - Desarrollado para estudiantes del noveno semestre.</p>
    </footer>
  </div>
</div>
